<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/header :: header}"></div>

<body>

  <div class="container mt-5">
    <h2>게시글 수정</h2>

    <form th:action="@{/boards/{id}(id=${board.id},page=${page},type=${type},keyword=${keyword})}" method="post">
      <p>
        제목
        <input type="text" name="title" th:field="${board.title}">
      </p>

      <p>
        작성자
        <input type="text" name="writer" th:field="${board.writer}">
      </p>

      <p>
        내용
        <textarea name="content" th:text="${board.content}"></textarea>
      </p>

      <button type="submit"> 수정 완료 </button>

    </form>
  </div>


<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
