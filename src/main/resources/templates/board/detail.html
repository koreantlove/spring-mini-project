<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>게시글 상세</title>
</head>
<body>

<h1>게시글 상세</h1>

<p>
  번호 :
  <span th:text="${board.id}"></span>
</p>

<p>
  제목 :
  <span th:text="${board.title}"></span>
</p>

<p>
  작성자 :
  <span th:text="${board.writer}"></span>
</p>

<p>
  내용 :
  <span th:text="${board.content}"></span>
</p>

<a th:href="@{/boards/{id}/edit(id=${board.id})}">
  수정
</a>

<br>

<!-- 삭제 기능은 post 권고, get 으로 할 경우, get 으로 호출한 것만으로 삭제가 될 위험 존재 -->

<form th:action="@{/boards/{id}/delete(id=${board.id})}"
      method="post"
      onsubmit="return confirm('정말 삭제하시겠습니까?')">

  <button type="submit">
    삭제
  </button>

</form>
<br>
<a href="/boards">
  목록
</a>

</body>
</html>
