<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록</title>
</head>
<body>

  <tr th:each="board : ${boards}">
    <td th:text="${board.id}"></td>
    <!-- <td th:text="${board.title}"></td> -->
    <a th:href="@{/boards/{id}(id=${board.id})}"
       th:text="${board.title}">
    </a>

    <td th:text="${board.writer}"></td>
  </tr>

</body>
</html>
