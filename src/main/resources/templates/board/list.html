<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/header :: header}"></div>

<body>

<div class="container mt-5">
    <div class="d-flex justify-content-between mb-3">
        <h2>게시글 목록</h2>
        <a th:href="@{/boards/new}" class="btn btn-primary">글쓰기</a>
    </div>

    <form th:action="@{/boards}" method="get">
        <div class="row mb-3">
            <div class="col-2">
                <select name="type" class="form-select">
                    <option value="title" th:selected="${type == 'title'}">
                        제목
                    </option>

                    <option value="writer" th:selected="${type == 'writer'}">
                        작성자
                    </option>
                </select>
            </div>

            <div class="col">
                <input class="form-control" type="text" name="keyword" th:value="${keyword}"
                        placeholder="검색어를 입력하세요">
            </div>

            <div class="col-auto">
                <button class="btn btn-primary" type="submit"> 검색  </button>
            </div>
        </div>

    </form>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="board : ${boards.content}">
            <td th:text="${board.id}"></td>
            <td>
                <a th:href="@{/boards/{id}(id=${board.id})}"
                   th:text="${board.title}">
                </a>
            </td>
            <td th:text="${board.writer}"></td>
        </tr>
        </tbody>
    </table>

    <nav>
        <ul class="pagination">
            <li th:classappend="${boards.first} ? 'disabled'">
                <a class="page-link"th:href="@{/boards(page=${boards.number-1},type=${type},keyword=${keyword})}">
                    이전
                </a>
            </li>

            <li th:each="pageNumber:${#numbers.sequence(0, boards.totalPages-1)}">
                <a class="page-link" th:text="${pageNumber+1}" th:href="@{/boards(page=${pageNumber},type=${type},keyword=${keyword})}">
                </a>
            </li>
            <li th:classappend="${boards.last} ? 'disabled'">
                <a class="page-link" th:href="@{/boards(page=${boards.number+1},type=${type},keyword=${keyword})}">
                    다음
                </a>
            </li>
        </ul>
    </nav>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>


</html>
